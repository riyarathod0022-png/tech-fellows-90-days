<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A clean and responsive QR code component built with HTML and CSS.">

    <title>QR Code Component | Tech Fellows Day 10</title>

    <!-- Google Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main-container">

        <article class="qr-card">

            <img
                src="image-qr-code.jpeg"
                alt="QR code to visit Frontend Mentor"
                class="qr-image"
            >

            <div class="card-content">

                <h1>
                    Improve your front-end skills by building projects
                </h1>

                <p>
                    Scan the QR code to visit Frontend Mentor and take your coding skills to the next level.
                </p>

            </div>

        </article>

    </main>

</body>
</html>
